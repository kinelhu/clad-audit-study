[project]
name = "clad-audit"
version = "0.1.0"
description = "LLM-assisted covariate-reporting audit of the lung-transplant CLAD literature"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.2",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pymupdf>=1.28.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clad_audit"]
